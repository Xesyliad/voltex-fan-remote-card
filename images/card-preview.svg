<svg xmlns="http://www.w3.org/2000/svg" width="420" height="700" viewBox="0 0 420 700" role="img" aria-labelledby="title desc">
  <title id="title">Voltex Fan Remote Home Assistant card</title>
  <desc id="desc">White five-speed fan remote with on, off, reverse and timer controls</desc>
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#e6e6e6"/>
      <stop offset="0.12" stop-color="#fafafa"/>
      <stop offset="0.88" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#dedede"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e7e7e7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="420" height="700" rx="26" fill="#f3f4f6"/>
  <text x="210" y="44" fill="#222" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">Lounge Fan</text>
  <g filter="url(#shadow)">
    <rect x="83" y="70" width="254" height="580" rx="25" fill="url(#body)" stroke="#ccc"/>
  </g>
  <g fill="url(#key)" stroke="#aaa" stroke-width="1.5" font-family="Arial,sans-serif" font-weight="bold" font-size="18" text-anchor="middle">
    <rect x="112" y="115" width="70" height="52" rx="8"/><text x="147" y="148" fill="#222" stroke="none">ON</text>
    <rect x="238" y="115" width="70" height="52" rx="8"/><text x="273" y="148" fill="#222" stroke="none">OFF</text>
    <circle cx="210" cy="223" r="38"/><text x="210" y="230" fill="#222" stroke="none">3</text>
    <circle cx="145" cy="268" r="38"/><text x="145" y="275" fill="#222" stroke="none">2</text>
    <circle cx="275" cy="268" r="38"/><text x="275" y="275" fill="#222" stroke="none">4</text>
    <circle cx="165" cy="346" r="38"/><text x="165" y="353" fill="#222" stroke="none">1</text>
    <circle cx="255" cy="346" r="38"/><text x="255" y="353" fill="#222" stroke="none">5</text>
    <circle cx="210" cy="290" r="38"/><text x="210" y="301" fill="#222" stroke="none" font-size="35" font-weight="normal">↻</text>
    <rect x="108" y="420" width="61" height="52" rx="8"/><text x="138.5" y="453" fill="#222" stroke="none">1H</text>
    <rect x="179.5" y="420" width="61" height="52" rx="8"/><text x="210" y="453" fill="#222" stroke="none">2H</text>
    <rect x="251" y="420" width="61" height="52" rx="8"/><text x="281.5" y="453" fill="#222" stroke="none">4H</text>
  </g>
  <text x="210" y="565" fill="#222" font-family="Arial,sans-serif" font-size="32" font-style="italic" font-weight="bold" letter-spacing="-2" text-anchor="middle">VOLTEX</text>
</svg>

